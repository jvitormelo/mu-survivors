<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MU Survivors</title>
<style>
  html, body { margin: 0; height: 100%; background: #050508; color: #f5e6b8; font-family: monospace; overflow: hidden; }
  /* The game is 4:3 (MU's 640x480 virtual screen); the canvas fits its parent. */
  #frame { height: 100vh; aspect-ratio: 4 / 3; max-width: 100vw; margin: 0 auto; position: relative; }
  #bevy { display: block; width: 100%; height: 100%; }
  #loader {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: radial-gradient(circle, #14111a 0%, #050508 80%);
    z-index: 10; pointer-events: none; transition: opacity 0.4s;
  }
  #loader h1 { color: #ffcc44; font-size: 26px; margin: 0 0 8px; letter-spacing: 2px; text-shadow: 0 2px 10px rgba(255,180,0,0.4); }
  #loader p { color: #b8c0d0; font-size: 13px; margin: 0 0 18px; }
  #bar-wrap { width: 340px; height: 14px; background: #1a1822; border: 1px solid #a6843a; padding: 2px; }
  #bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #b86b14, #ffd24c); transition: width 0.1s; }
  #status { margin-top: 10px; font-size: 12px; color: #d8c898; }
</style>
</head>
<body>
<div id="frame">
  <div id="loader">
    <h1>MU SURVIVORS</h1>
    <p>WASD / Mouse: Move &nbsp;|&nbsp; Space: Dash &nbsp;|&nbsp; K: Golden Invasion &nbsp;|&nbsp; Tab: Class</p>
    <div id="bar-wrap"><div id="bar-fill"></div></div>
    <div id="status">Iniciando download paralelo...</div>
  </div>
  <canvas id="bevy"></canvas>
</div>
<script type="module">
  import init from "./pkg/mu-client.js";
  if (!location.search) {
    history.replaceState(null, "", "?args=--survivor");
  }

  const cache = new Map();
  window.__MU_CACHE = cache;
  window.__mu_get = (url) => {
    const clean = decodeURIComponent(url);
    return cache.get(clean) || cache.get(clean.toLowerCase()) || null;
  };

  const fill = document.getElementById("bar-fill");
  const status = document.getElementById("status");
  const loader = document.getElementById("loader");

  async function gunzip(blobs) {
    const ds = new DecompressionStream("gzip");
    const stream = new Blob(blobs).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  function unpack(buf) {
    const view = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    const dec = new TextDecoder();
    let i = 0;
    while (i < buf.byteLength) {
      const plen = view.getUint32(i, true); i += 4;
      const path = dec.decode(buf.subarray(i, i + plen)); i += plen;
      const dlen = view.getUint32(i, true); i += 4;
      const slice = buf.subarray(i, i + dlen); i += dlen;
      cache.set(path, slice);
      cache.set(path.toLowerCase(), slice);
    }
  }

  async function boot() {
    const t0 = performance.now();
    const mfRes = await fetch("./chunks/manifest.json").catch(() => null);
    let wasmBuf = null;
    if (mfRes && mfRes.ok) {
      const mf = await mfRes.json();
      const total = mf.total_bytes || 29500000;
      let loaded = 0;
      const update = () => {
        const dt = Math.max(0.1, (performance.now() - t0) / 1000);
        const mb = (loaded / 1048576).toFixed(1);
        const totMb = (total / 1048576).toFixed(1);
        const spd = (loaded / 1048576 / dt).toFixed(1);
        const pct = Math.min(97, Math.round((loaded / total) * 100));
        fill.style.width = `${pct}%`;
        status.textContent = `Baixando (${mb} / ${totMb} MB — ${spd} MB/s)...`;
      };
      const fetchChunk = async (url) => {
        const r = await fetch(url);
        const b = new Uint8Array(await r.arrayBuffer());
        loaded += b.byteLength;
        update();
        return b;
      };
      const [wasmParts, packParts] = await Promise.all([
        Promise.all(mf.wasm.map(fetchChunk)),
        Promise.all(mf.pack.map(fetchChunk)),
      ]);
      status.textContent = "Descompactando engine e assets na RAM...";
      const [w, p] = await Promise.all([gunzip(wasmParts), gunzip(packParts)]);
      wasmBuf = w;
      unpack(p);
    } else {
      const r = await fetch("./pkg/mu-client_bg.wasm");
      wasmBuf = new Uint8Array(await r.arrayBuffer());
    }
    fill.style.width = "100%";
    status.textContent = "Iniciando mundo 3D...";
    setTimeout(() => { loader.style.opacity = "0"; setTimeout(() => loader.remove(), 450); }, 500);
    init({ module_or_path: wasmBuf }).catch((e) => {
      if (!String(e).includes("Using exceptions for control flow")) {
        console.error(e);
        status.textContent = "Erro: " + e;
      }
    });
  }

  boot();
</script>
</body>
</html>
